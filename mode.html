<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Game Mode</title>
  <style>
    body { background-color: #ffffff; color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 40px; text-transform: uppercase; }
    .cards-container { display: flex; gap: 35px; justify-content: center; }
    .card { width: 320px; height: 200px; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.12); cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.3s; }
    .card.career { background: url('career.jpg') center/cover no-repeat; border: 3px solid #65a30d; }
    .card.career:hover { transform: translateY(-8px); }
    .card.tournament { background: #e2e8f0; border: 3px solid #cbd5e1; cursor: not-allowed; display: flex; align-items: center; justify-content: center; }
    .overlay { background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 100%); width: 100%; padding: 20px; color: white; text-align: center; }
    .title { font-size: 1.5rem; font-weight: 800; letter-spacing: 1.5px; }
    .btn-back { position: absolute; top: 30px; left: 30px; padding: 10px 22px; font-weight: 700; background: #0f172a; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <button class="btn-back" onclick="window.location.href='index.html'">&#8592; GARAGE</button>
  <h1>SELECT GAME MODE</h1>
  <div class="cards-container">
    <div class="card career" onclick="selectMode('career')">
      <div class="overlay"><div class="title">CAREER</div></div>
    </div>
    <div class="card tournament">
      <div style="color: #64748b; text-align:center;"><span style="font-size: 3rem;">🔒</span><div class="title">TOURNAMENT</div></div>
    </div>
  </div>

  <script>
    function selectMode(mode) {
      const config = JSON.parse(localStorage.getItem('raceConfig') || '{}');
      config.mode = mode;
      localStorage.setItem('raceConfig', JSON.stringify(config));
      window.location.href = 'missions.html';
    }
  </script>
</body>
</html>
