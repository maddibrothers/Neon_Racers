<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Racing Game Lobby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0d12;
      color: #fff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ---------------- 3D LOBBY UI OVERLAY ---------------- */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 25px;
    }

    /* Model Switch Navigation Arrows (Black Background & Green Arrow) */
    .nav-arrow {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(18, 21, 28, 0.85);
      border: 2px solid #a3e635;
      color: #a3e635;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(163, 230, 53, 0.3);
      transition: all 0.25s ease;
      z-index: 5;
    }

    /* Hover state: retains black background while enhancing glow/scale */
    .nav-arrow:hover {
      background: rgba(18, 21, 28, 0.95);
      color: #a3e635;
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 0 30px rgba(163, 230, 53, 0.7);
    }

    .nav-arrow.left { left: 35px; }
    .nav-arrow.right { right: 35px; }

    /* Footer & Select Button */
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
    }

    .btn-select-car {
      pointer-events: auto;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #0b0d12;
      background: linear-gradient(135deg, #a3e635 0%, #65a30d 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(163, 230, 53, 0.4);
      transition: all 0.3s ease;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
    }

    .btn-select-car:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 30px rgba(163, 230, 53, 0.7);
      background: linear-gradient(135deg, #bef264 0%, #4d7c0f 100%);
    }

    /* ---------------- INITIAL LOADING OVERLAY ---------------- */
    #loader {
      position: fixed;
      inset: 0;
      background: #0b0d12;
      z-index: 99;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #a3e635;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Loading Screen (Shows only on initial launch) -->
  <div id="loader">
    <div class="spinner"></div>
    <p style="color: #8a99ad; letter-spacing: 1px;">LOADING GARAGE LOBBY...</p>
  </div>

  <!-- 3D Lobby UI Overlay -->
  <div class="ui-layer" id="lobby-ui">
    <button class="nav-arrow left" id="btn-prev">&#10094;</button>
    <button class="nav-arrow right" id="btn-next">&#10095;</button>

    <div class="footer">
      <button class="btn-select-car" id="btn-select-car">SELECT CAR</button>
    </div>
  </div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- AUDIO SETUP ---
    // UI Pop/Click sound effect
    const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
    clickSound.volume = 0.5;

    function playClickSound() {
      clickSound.currentTime = 0;
      clickSound.play().catch(() => {}); // catch browser autoplay restrictions gracefully
    }

    // Car Model Database
    const carModels = ['jeep.glb', 'redcar.glb'];
    let currentCarIndex = 0;
    let currentCarMesh = null;
    let isInitialLoad = true;
    let currentLoadToken = 0; // Prevent overlapping loads when clicking rapidly

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c10);
    scene.fog = new THREE.FogExp2(0x0a0c10, 0.025);

    // Camera Setup - Fixed Position
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(-3.39, 1.76, 2.67);
    camera.lookAt(0, 0.5, 0);

    // Renderer (Shadows Disabled)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const topLight = new THREE.SpotLight(0xffffff, 180);
    topLight.position.set(0, 6, 0);
    topLight.angle = Math.PI / 2.5;
    topLight.penumbra = 0.5;
    scene.add(topLight);

    const mainLight = new THREE.SpotLight(0xff7700, 100);
    mainLight.position.set(5, 8, 5);
    mainLight.angle = Math.PI / 3;
    mainLight.penumbra = 0.8;
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x00aaff, 3);
    rimLight.position.set(-5, 5, -5);
    scene.add(rimLight);

    // Texture Loader
    const textureLoader = new THREE.TextureLoader();

    function createWhiteTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#1c202a';
      ctx.fillRect(0, 0, 512, 512);

      const tileSize = 250;
      const gap = 10;

      for (let x = 0; x < 512; x += tileSize) {
        for (let y = 0; y < 512; y += tileSize) {
          ctx.fillStyle = '#f2f4f8';
          ctx.fillRect(x + gap / 2, y + gap / 2, tileSize - gap, tileSize - gap);

          ctx.strokeStyle = '#d0d5e0';
          ctx.lineWidth = 3;
          ctx.strokeRect(x + gap / 2, y + gap / 2, tileSize - gap, tileSize - gap);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(10, 10);
      return texture;
    }

    const floorSize = 24;
    const tileTexture = createWhiteTileTexture();
    const floorMat = new THREE.MeshStandardMaterial({
      map: tileTexture,
      roughness: 0.6,
      metalness: 0.1
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(floorSize, floorSize), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    scene.add(floor);

    let carPivot = new THREE.Group();
    scene.add(carPivot);

    const machineRadius = 2.8;
    const machineHeight = 0.08;

    const machineGeo = new THREE.CylinderGeometry(machineRadius, machineRadius + 0.1, machineHeight, 64);
    const machineMat = new THREE.MeshStandardMaterial({
      color: 0x12151c,
      roughness: 0.3,
      metalness: 0.8
    });
    const machineBase = new THREE.Mesh(machineGeo, machineMat);
    machineBase.position.y = machineHeight / 2;
    carPivot.add(machineBase);

    const neonRingGeo = new THREE.RingGeometry(machineRadius - 0.25, machineRadius - 0.15, 64);
    const neonRingMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide });
    const neonRing = new THREE.Mesh(neonRingGeo, neonRingMat);
    neonRing.rotation.x = Math.PI / 2;
    neonRing.position.y = machineHeight + 0.001;
    carPivot.add(neonRing);

    const innerTopGeo = new THREE.CircleGeometry(machineRadius - 0.25, 64);
    const innerTopMat = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.5, metalness: 0.5 });
    const innerTop = new THREE.Mesh(innerTopGeo, innerTopMat);
    innerTop.rotation.x = -Math.PI / 2;
    innerTop.position.y = machineHeight + 0.002;
    carPivot.add(innerTop);

    // --- WALLS CREATION ---
    const wallHeight = 5.5; 
    const wallWidth = 13.5;

    const backTexture = textureLoader.load('back.jpg');
    backTexture.colorSpace = THREE.SRGBColorSpace;
    const backWallMat = new THREE.MeshStandardMaterial({ map: backTexture, roughness: 0.4, metalness: 0.1 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(wallWidth, wallHeight), backWallMat);
    backWall.position.set(7.5 - (wallWidth / 2), wallHeight / 2, -7.5);
    scene.add(backWall);

    const rightTexture = textureLoader.load('right.jpg');
    rightTexture.colorSpace = THREE.SRGBColorSpace;
    const rightWallMat = new THREE.MeshStandardMaterial({ map: rightTexture, roughness: 0.4, metalness: 0.1 });
    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(wallWidth, wallHeight), rightWallMat);
    rightWall.position.set(7.5, wallHeight / 2, -7.5 + (wallWidth / 2));
    rightWall.rotation.y = -Math.PI / 2;
    scene.add(rightWall);

    const gltfLoader = new GLTFLoader();

    function loadCar(modelName) {
      // Increment token for each new load request
      currentLoadToken++;
      const thisToken = currentLoadToken;

      gltfLoader.load(
        modelName,
        (gltf) => {
          // If another click triggered a newer load request while this was downloading, ignore this one
          if (thisToken !== currentLoadToken) return;

          // Safely remove previous car mesh
          if (currentCarMesh) {
            carPivot.remove(currentCarMesh);
            currentCarMesh = null;
          }

          const model = gltf.scene;

          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          model.position.sub(center);
          model.position.y += (size.y / 2) + machineHeight;

          currentCarMesh = model;
          carPivot.add(currentCarMesh);

          // Hide loader only during initial page load
          if (isInitialLoad) {
            const loaderEl = document.getElementById('loader');
            if (loaderEl) {
              loaderEl.style.opacity = '0';
              setTimeout(() => loaderEl.style.display = 'none', 500);
            }
            isInitialLoad = false;
          }
        },
        undefined,
        (error) => {
          console.error(`Error loading model ${modelName}:`, error);
          if (isInitialLoad && thisToken === currentLoadToken) {
            const loaderEl = document.getElementById('loader');
            if (loaderEl) {
              loaderEl.style.opacity = '0';
              setTimeout(() => loaderEl.style.display = 'none', 500);
            }
            isInitialLoad = false;
          }
        }
      );
    }

    loadCar(carModels[currentCarIndex]);

    document.getElementById('btn-prev').addEventListener('click', () => {
      playClickSound();
      currentCarIndex = (currentCarIndex - 1 + carModels.length) % carModels.length;
      loadCar(carModels[currentCarIndex]);
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      playClickSound();
      currentCarIndex = (currentCarIndex + 1) % carModels.length;
      loadCar(carModels[currentCarIndex]);
    });

    // Directly save race config and navigate to map1.html on click
    document.getElementById('btn-select-car').addEventListener('click', () => {
      playClickSound();
      const selectedConfig = {
        carModel: carModels[currentCarIndex],
        map: 'map1.html',
        mode: 'career'
      };

      localStorage.setItem('raceConfig', JSON.stringify(selectedConfig));
      setTimeout(() => {
        window.location.href = selectedConfig.map;
      }, 150);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (carPivot) {
        carPivot.rotation.y += 0.3 * delta;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
