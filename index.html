<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Racing Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
        }
        canvas {
            display: block;
        }
        
        /* Game UI Overlays */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        /* --- NEW: Loading UI --- */
        #loading-screen {
            background-color: #111;
            z-index: 300;
        }
        #loading-title {
            font-size: 32px;
            font-weight: 900;
            color: #ffaa00;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        #loading-bar-container {
            width: 60%;
            max-width: 400px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #555;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        #loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffaa, #00cc88);
            transition: width 0.1s linear;
        }
        #loading-text {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        #countdown-screen { pointer-events: none; }

        #countdown-text {
            font-size: 150px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 4px 4px 10px black;
            color: #00ffaa;
        }

        #winner-screen { background: rgba(0, 0, 0, 0.7); }

        #winner-text {
            font-size: 80px;
            font-weight: 900;
            color: #ffd700;
            text-transform: uppercase;
            text-shadow: 4px 4px 15px black;
            text-align: center;
        }

        /* --- Mini HUD (Top Left) --- */
        #mini-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-style: italic;
            border: 2px solid #555;
            z-index: 100;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 5px;
            display: none; /* Hidden until race starts */
        }
        .hud-pos { font-size: 28px; font-weight: 900; color: #ffd700; }
        .hud-lap { font-size: 18px; font-weight: bold; color: #87CEEB; }

        /* --- Camera Toggle Button (Top Right) --- */
        #camera-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #555;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
            transition: background 0.2s, color 0.2s;
            display: none; /* Hidden until race starts */
        }
        #camera-btn:hover { background: #87CEEB; color: #000; }

        #dashboard {
            position: absolute;
            top: 20px;
            width: 100%;
            display: none; 
            justify-content: center;
            gap: 40px;
            pointer-events: none;
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            z-index: 10;
        }
        .speed-box { color: #00ffaa; }
        .gear-box { color: #ffaa00; }

        /* --- Player Controls UI --- */
        .controls-container { display: none; }
        #controls-left {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 100;
        }
        #controls-right {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="overlay-screen">
        <div id="loading-title">Loading Track</div>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">0%</div>
    </div>

    <div id="mini-hud">
        <div id="pos-display" class="hud-pos">POS: 1ST</div>
        <div id="lap-display" class="hud-lap">LAP: 1/4</div>
    </div>

    <button id="camera-btn">🎥 3rd Person</button>

    <div id="countdown-screen" class="overlay-screen" style="display: none; background: transparent;">
        <div id="countdown-text">3</div>
    </div>

    <div id="winner-screen" class="overlay-screen" style="display: none;">
        <div id="winner-text">Player 1 Wins!</div>
        <button id="restart-btn" style="margin-top:20px; padding:10px 20px; font-size:20px; cursor:pointer; background: #ffaa00; border: 2px solid white; border-radius: 8px;">Restart Game</button>
    </div>

    <div id="dashboard">
        <div class="speed-box"><span id="speed-val">0</span> KM/H</div>
        <div class="gear-box"><span id="gear-val">1</span></div>
    </div>

    <!-- Player Driving Controls -->
    <div id="player-controls" class="controls-container">
        <div id="controls-left">
            <div id="btn-brake" class="control-btn" title="Brake / Reverse">🛑</div>
        </div>
        <div id="controls-right">
            <div id="btn-left" class="control-btn" title="Steer Left">◀</div>
            <div id="btn-right" class="control-btn" title="Steer Right">▶</div>
        </div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Game State Variables ---
        let raceState = 'LOADING'; 
        const TOTAL_LAPS = 4; 
        const roadWidth = 24;

        // Player Control State
        const keys = { left: false, right: false, brake: false };
        
        function bindControl(elementId, keyName) {
            const el = document.getElementById(elementId);
            const press = (e) => { e.preventDefault(); keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };
            
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
            el.addEventListener('touchstart', press);
            el.addEventListener('touchend', release);
        }
        
        bindControl('btn-brake', 'brake');
        bindControl('btn-left', 'left');
        bindControl('btn-right', 'right');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === ' ') keys.brake = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === ' ') keys.brake = false;
        });

        // 1. Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 15000); 
        camera.position.set(0, 150, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        // --- NEW: Loading Manager Setup ---
        const manager = new THREE.LoadingManager();
        
        manager.onProgress = function (url, itemsLoaded, itemsTotal) {
            const progress = (itemsLoaded / itemsTotal) * 100;
            document.getElementById('loading-bar').style.width = progress + '%';
            document.getElementById('loading-text').innerText = Math.floor(progress) + '%';
        };

        manager.onLoad = function () {
            // Delay slightly for smoother UX transition
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('mini-hud').style.display = 'flex';
                document.getElementById('camera-btn').style.display = 'block';
                startGame();
            }, 500);
        };

        // 2. Sky Sphere
        const textureLoader = new THREE.TextureLoader(manager); // Added manager
        const skyGeo = new THREE.SphereGeometry(8000, 32, 32); 
        const skyMat = new THREE.MeshBasicMaterial({
            map: textureLoader.load('ggsky.png'),
            side: THREE.BackSide 
        });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        // 3. Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 500, 0);
        scene.add(hemiLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5)); 

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
        dirLight.position.set(50, 400, 50); 
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        scene.add(dirLight);

        // 4. Ground
        const groundGeo = new THREE.PlaneGeometry(1600, 1600);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 5. Track Path 
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-160, 0, 160),
            new THREE.Vector3(0, 0, 200),
            new THREE.Vector3(160, 0, 160),
            new THREE.Vector3(200, 0, 0),
            new THREE.Vector3(100, 0, -120),
            new THREE.Vector3(0, 0, -60),
            new THREE.Vector3(-100, 0, -120),
            new THREE.Vector3(-200, 0, 0)
        ], true);

        const pointsCount = 300;
        const trackPoints = curve.getSpacedPoints(pointsCount);

        // 6. Build Road
        const roadVertices = [];
        const roadIndices = [];
        const upVector = new THREE.Vector3(0, 1, 0);

        for (let i = 0; i < trackPoints.length; i++) {
            const point = trackPoints[i];
            const t = i / (trackPoints.length - 1);
            const tangent = curve.getTangent(t);
            const right = new THREE.Vector3().crossVectors(upVector, tangent).normalize();

            const leftPoint = new THREE.Vector3().copy(point).add(right.clone().multiplyScalar(roadWidth / 2));
            const rightPoint = new THREE.Vector3().copy(point).add(right.clone().multiplyScalar(-roadWidth / 2));

            roadVertices.push(leftPoint.x, leftPoint.y, leftPoint.z);
            roadVertices.push(rightPoint.x, rightPoint.y, rightPoint.z);
        }

        for (let i = 0; i < trackPoints.length - 1; i++) {
            const currentLeft = i * 2;
            const currentRight = i * 2 + 1;
            const nextLeft = (i + 1) * 2;
            const nextRight = (i + 1) * 2 + 1;
            roadIndices.push(currentLeft, nextLeft, currentRight);
            roadIndices.push(currentRight, nextLeft, nextRight);
        }

        const roadGeo = new THREE.BufferGeometry();
        roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
        roadGeo.setIndex(roadIndices);
        roadGeo.computeVertexNormals();

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.8, side: THREE.DoubleSide });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.position.y = 0.1; 
        road.receiveShadow = true;
        scene.add(road);

        // 7. Generate Procedural Low-Poly Trees
        const trunkGeo = new THREE.CylinderGeometry(0.8, 1.2, 4, 5); 
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 1.0 });
        const leavesGeo = new THREE.ConeGeometry(4, 10, 5); 
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.9, flatShading: true });

        function createTree(x, z) {
            const tree = new THREE.Group();
            
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            tree.add(trunk);
            
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 8;
            leaves.castShadow = true;
            leaves.receiveShadow = true;
            tree.add(leaves);
            
            tree.position.set(x, 0, z);
            
            const scale = 0.7 + Math.random() * 0.8;
            tree.scale.set(scale, scale, scale);
            tree.rotation.y = Math.random() * Math.PI * 2;
            
            scene.add(tree);
        }

        for (let i = 0; i < trackPoints.length; i += 3) {
            const pt = trackPoints[i];
            const t = i / (trackPoints.length - 1);
            const tangent = curve.getTangent(t);
            const right = new THREE.Vector3().crossVectors(upVector, tangent).normalize();

            if (Math.random() > 0.4) {
                const distLeft = (roadWidth / 2) + 12 + Math.random() * 30;
                const treePos = pt.clone().add(right.clone().multiplyScalar(distLeft));
                createTree(treePos.x, treePos.z);
            }
            
            if (Math.random() > 0.4) {
                const distRight = (-roadWidth / 2) - 12 - Math.random() * 30;
                const treePos = pt.clone().add(right.clone().multiplyScalar(distRight));
                createTree(treePos.x, treePos.z);
            }
        }

        // --- CONTINUOUS YELLOW TUBE BARRIERS ---
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.4, metalness: 0.1 });
        const leftBarrierPts = [];
        const rightBarrierPts = [];
        
        for (let i = 0; i < trackPoints.length; i++) {
            const pt = trackPoints[i];
            const t = i / (trackPoints.length - 1);
            const tangent = curve.getTangent(t);
            const right = new THREE.Vector3().crossVectors(upVector, tangent).normalize();
            
            const bLeft = pt.clone().add(right.clone().multiplyScalar((roadWidth / 2) + 0.5));
            bLeft.y = 1.0; 
            leftBarrierPts.push(bLeft);

            const bRight = pt.clone().add(right.clone().multiplyScalar((-roadWidth / 2) - 0.5));
            bRight.y = 1.0;
            rightBarrierPts.push(bRight);
        }

        const leftCurve = new THREE.CatmullRomCurve3(leftBarrierPts, true);
        const rightCurve = new THREE.CatmullRomCurve3(rightBarrierPts, true);
        
        const leftTubeGeo = new THREE.TubeGeometry(leftCurve, 300, 0.6, 8, true);
        const rightTubeGeo = new THREE.TubeGeometry(rightCurve, 300, 0.6, 8, true);

        const leftTubeMesh = new THREE.Mesh(leftTubeGeo, barrierMat);
        leftTubeMesh.receiveShadow = true;
        leftTubeMesh.castShadow = true;
        scene.add(leftTubeMesh);

        const rightTubeMesh = new THREE.Mesh(rightTubeGeo, barrierMat);
        rightTubeMesh.receiveShadow = true;
        rightTubeMesh.castShadow = true;
        scene.add(rightTubeMesh);

        // --- SPARKS PARTICLE SYSTEM ---
        const sparkGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
        const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const sparks = [];

        function emitSparks(position) {
            for(let i = 0; i < 4; i++) {
                const spark = new THREE.Mesh(sparkGeo, sparkMat);
                spark.position.copy(position);
                
                spark.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        Math.random() * 10 + 5,
                        (Math.random() - 0.5) * 20
                    ),
                    life: 0.3 + Math.random() * 0.4
                };
                
                scene.add(spark);
                sparks.push(spark);
            }
        }

        function updateSparks(delta) {
            for(let i = sparks.length - 1; i >= 0; i--) {
                const spark = sparks[i];
                spark.userData.life -= delta;
                
                if (spark.userData.life <= 0) {
                    scene.remove(spark);
                    sparks.splice(i, 1);
                } else {
                    spark.position.addScaledVector(spark.userData.velocity, delta);
                    spark.userData.velocity.y -= 30 * delta; 
                    
                    const scale = spark.userData.life;
                    spark.scale.set(scale, scale, scale);
                }
            }
        }

        // Generate Black & White Checkered Start Line
        const startCanvas = document.createElement('canvas');
        startCanvas.width = 256; startCanvas.height = 256;
        const startCtx = startCanvas.getContext('2d');
        startCtx.fillStyle = '#ffffff'; startCtx.fillRect(0, 0, 256, 256);
        startCtx.fillStyle = '#000000'; startCtx.fillRect(0, 0, 128, 128); startCtx.fillRect(128, 128, 128, 128);
        const startTex = new THREE.CanvasTexture(startCanvas);
        startTex.wrapS = THREE.RepeatWrapping; startTex.wrapT = THREE.RepeatWrapping;
        startTex.repeat.set(6, 2); 

        const startGeo = new THREE.PlaneGeometry(roadWidth, 4);
        const startMat = new THREE.MeshBasicMaterial({ map: startTex });
        const startLine = new THREE.Mesh(startGeo, startMat);
        const sPt = curve.getPointAt(0); 
        const sTan = curve.getTangentAt(0);
        startLine.position.copy(sPt);
        startLine.position.y = 0.12;
        startLine.lookAt(sPt.clone().add(sTan));
        startLine.rotateX(-Math.PI / 2);
        scene.add(startLine);

        // Visual Anti-Cheat Checkpoints
        const cpGeo = new THREE.PlaneGeometry(roadWidth, 1.5);
        const cpMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.4 });
        [0.25, 0.55, 0.85].forEach(cp => {
            const mesh = new THREE.Mesh(cpGeo, cpMat);
            const pt = curve.getPointAt(cp);
            const tan = curve.getTangentAt(cp);
            mesh.position.copy(pt);
            mesh.position.y = 0.11;
            mesh.lookAt(pt.clone().add(tan));
            mesh.rotateX(-Math.PI / 2);
            scene.add(mesh);
        });

        // 8. Cars Logic 
        const cars = [];
        const colors = [0x00ffaa, 0x0000ff, 0xff0000, 0xffff00, 0xff8800, 0xff00ff];
        const loader = new GLTFLoader(manager); // Added manager
        
        for (let i = 1; i <= 6; i++) {
            const carGroup = new THREE.Group();
            const fallbackMesh = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 5), new THREE.MeshStandardMaterial({ color: colors[i-1] }));
            fallbackMesh.position.y = 0.75;
            carGroup.add(fallbackMesh);
            scene.add(carGroup);

            const rowIndex = Math.floor((i - 1) / 2);
            const isLeftColumn = (i % 2 !== 0);
            
            const initialLane = isLeftColumn ? -4 : 4;
            const initialProgress = 0.995 - (rowIndex * 0.012); 
            const isPlayer = (i === 1);

            const startPt = curve.getPointAt(initialProgress);
            const startTan = curve.getTangentAt(initialProgress);
            const startRight = new THREE.Vector3().crossVectors(upVector, startTan).normalize();
            
            startPt.add(startRight.clone().multiplyScalar(initialLane));
            carGroup.position.copy(startPt);
            
            const lookPt = curve.getPointAt((initialProgress + 0.01) % 1);
            const lookTan = curve.getTangentAt((initialProgress + 0.01) % 1);
            const lookRight = new THREE.Vector3().crossVectors(upVector, lookTan).normalize();
            lookPt.add(lookRight.clone().multiplyScalar(initialLane));
            carGroup.lookAt(lookPt);

            cars.push({
                id: isPlayer ? 'You' : `NPC ${i-1}`,
                isPlayer: isPlayer,
                mesh: carGroup,
                fallback: fallbackMesh,
                progress: initialProgress,
                lap: 0, 
                nextCP: 4, 
                lane: initialLane, 
                targetLane: initialLane, 
                laneChangeTimer: isPlayer ? 0 : Math.random() * 3, 
                score: 0,
                steerAngle: 0,
                speedKmh: 0,
                gear: 1,
                maxSpeed: isPlayer ? 155 : 152 + (Math.random() * 6), 
                enginePowerModifier: isPlayer ? 1.0 : 0.94 + (Math.random() * 0.1) 
            });
        }

        // Load Jeep GLTF
        loader.load('jeep.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            cars.forEach(car => {
                const clone = model.clone();
                car.mesh.add(clone);
                car.fallback.visible = false;
            });
        });

        // --- NEW: Auto Start Game Function ---
        function startGame() {
            document.getElementById('countdown-screen').style.display = 'flex';
            
            let count = 3;
            raceState = 'COUNTDOWN';
            const countdownEl = document.getElementById('countdown-text');
            countdownEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else if (count === 0) {
                    countdownEl.innerText = 'GO!';
                    countdownEl.style.color = '#fff';
                } else {
                    clearInterval(interval);
                    document.getElementById('countdown-screen').style.display = 'none';
                    document.getElementById('player-controls').style.display = 'block'; 
                    raceState = 'RACING';
                }
            }, 1000);
        }

        document.getElementById('restart-btn').addEventListener('click', () => {
            location.reload(); 
        });

        // 9. Camera State Logic 
        let cameraMode = '3RD_PERSON'; 
        let targetCar = cars[0]; 
        let lastCameraMode = cameraMode;
        
        const currentLookAt = new THREE.Vector3();
        let dynamicCamOffsetZ = -4.5; 
        let dynamicCamFov = 60;       

        document.getElementById('camera-btn').addEventListener('click', () => {
            const btn = document.getElementById('camera-btn');
            if (cameraMode === '3RD_PERSON') {
                cameraMode = '1ST_PERSON';
                btn.innerText = '🎥 1st Person';
            } else {
                cameraMode = '3RD_PERSON';
                btn.innerText = '🎥 3rd Person';
            }
        });

        function updateMiniHUD() {
            const sortedCars = [...cars].sort((a, b) => b.score - a.score);
            const playerIndex = sortedCars.findIndex(c => c.isPlayer);
            const position = playerIndex + 1;
            
            let posText = position + 'TH';
            if (position === 1) posText = '1ST';
            else if (position === 2) posText = '2ND';
            else if (position === 3) posText = '3RD';

            const displayLap = Math.max(1, Math.min(targetCar.lap, TOTAL_LAPS));
            
            document.getElementById('pos-display').innerText = `POS: ${posText}`;
            document.getElementById('lap-display').innerText = `LAP: ${displayLap}/${TOTAL_LAPS}`;
        }

        const clock = new THREE.Clock();
        let uiUpdateTimer = 0;
        const TRACK_LENGTH_METERS = 2000; 

        // 10. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); 

            let snapCamera = (cameraMode !== lastCameraMode);
            lastCameraMode = cameraMode;

            updateSparks(delta);

            cars.forEach(car => {
                if (raceState === 'RACING' || raceState === 'FINISHED') {
                    
                    // --- PLAYER PHYSICS ---
                    if (car.isPlayer) {
                        
                        if (keys.brake) {
                            if (car.speedKmh > 0) {
                                car.speedKmh -= 60.0 * delta; 
                                if (car.speedKmh < 0) car.speedKmh = 0; 
                            } else {
                                car.gear = 'R';
                                car.speedKmh -= 15.0 * delta; 
                            }
                        } else {
                            if (car.speedKmh < 0) {
                                car.speedKmh += 40.0 * delta; 
                                if (car.speedKmh > 0) car.speedKmh = 0; 
                            } else {
                                let acc = 0;
                                if (car.speedKmh < 45) { car.gear = 1; acc = 18.0; } 
                                else if (car.speedKmh < 85) { car.gear = 2; acc = 11.5; } 
                                else if (car.speedKmh < 120) { car.gear = 3; acc = 7.5; } 
                                else if (car.speedKmh < 145) { car.gear = 4; acc = 2.0; } 
                                else { car.gear = 5; acc = 0.5; }
                                
                                car.speedKmh += (acc * car.enginePowerModifier * delta);
                            }
                        }
                        
                        car.speedKmh = Math.max(-30, Math.min(car.speedKmh, car.maxSpeed));

                        const turnSpeed = 2.0; 
                        let targetSteer = 0;
                        if (keys.left) targetSteer = turnSpeed;
                        if (keys.right) targetSteer = -turnSpeed;
                        
                        car.steerAngle = THREE.MathUtils.lerp(car.steerAngle, targetSteer, 5.0 * delta);
                        
                        let speedFactor = Math.abs(car.speedKmh) / 40.0;
                        speedFactor = Math.min(1.0, Math.max(0.0, speedFactor)); 
                        const reverseMult = car.speedKmh < 0 ? -1 : 1;
                        
                        car.mesh.rotateY(car.steerAngle * delta * speedFactor * reverseMult);

                        const speedMs = car.speedKmh / 3.6;
                        const dir = new THREE.Vector3();
                        car.mesh.getWorldDirection(dir); 
                        car.mesh.position.add(dir.multiplyScalar(speedMs * delta));
                        car.mesh.position.y = 0.1; 

                        let closestDist = Infinity;
                        let closestIdx = 0;
                        for(let j = 0; j < trackPoints.length; j++) {
                            const dx = car.mesh.position.x - trackPoints[j].x;
                            const dz = car.mesh.position.z - trackPoints[j].z;
                            const distSq = dx*dx + dz*dz;
                            if(distSq < closestDist) {
                                closestDist = distSq;
                                closestIdx = j;
                            }
                        }
                        
                        const currentDistFromCenter = Math.sqrt(closestDist);
                        const maxDist = (roadWidth / 2) - 1.25; 
                        
                        if (currentDistFromCenter > maxDist) {
                            const centerPt = trackPoints[closestIdx];
                            const pushDir = new THREE.Vector3().subVectors(car.mesh.position, centerPt);
                            pushDir.y = 0;
                            pushDir.normalize().multiplyScalar(maxDist);
                            
                            car.mesh.position.copy(centerPt).add(pushDir);
                            car.mesh.position.y = 0.1;
                            
                            const grindingFriction = 80.0 * delta; 
                            if (car.speedKmh > 0) {
                                car.speedKmh -= grindingFriction;
                                if (car.speedKmh < 0) car.speedKmh = 0;
                            } else if (car.speedKmh < 0) {
                                car.speedKmh += grindingFriction;
                                if (car.speedKmh > 0) car.speedKmh = 0;
                            }

                            if (Math.abs(car.speedKmh) > 20 && Math.random() > 0.5) {
                                const contactPos = car.mesh.position.clone();
                                contactPos.add(pushDir.clone().normalize().multiplyScalar(1.25));
                                contactPos.y = 0.6; 
                                emitSparks(contactPos);
                            }
                        }

                        const newProgress = closestIdx / trackPoints.length;
                        
                        if (car.progress > 0.8 && newProgress < 0.2) {
                            if (car.nextCP === 4) { 
                                car.lap++;
                                car.nextCP = 1; 
                                
                                if (car.lap > TOTAL_LAPS && raceState === 'RACING') {
                                    raceState = 'FINISHED';
                                    document.getElementById('winner-screen').style.display = 'flex';
                                    document.getElementById('winner-text').innerText = `${car.id} WINS!`;
                                    document.getElementById('player-controls').style.display = 'none';
                                }
                            }
                        }
                        
                        car.progress = newProgress;
                        
                        let p = car.progress;
                        if (car.nextCP === 1 && p > 0.20 && p < 0.40) car.nextCP = 2;
                        if (car.nextCP === 2 && p > 0.50 && p < 0.70) car.nextCP = 3;
                        if (car.nextCP === 3 && p > 0.80 && p < 0.98) car.nextCP = 4;
                    } 
                    
                    // --- NPC SPLINE DRIVING ---
                    else {
                        let accelerationRate = 0; 
                        if (car.speedKmh < 45) { car.gear = 1; accelerationRate = 18.0; }
                        else if (car.speedKmh < 85) { car.gear = 2; accelerationRate = 11.5; }
                        else if (car.speedKmh < 120) { car.gear = 3; accelerationRate = 7.5; }
                        else if (car.speedKmh < 145) { car.gear = 4; accelerationRate = 2.0; }
                        else { car.gear = 5; accelerationRate = 0.5; }

                        accelerationRate *= car.enginePowerModifier;
                        car.speedKmh += (accelerationRate * delta);
                        car.speedKmh = Math.min(car.speedKmh, car.maxSpeed);

                        car.laneChangeTimer -= delta;
                        if (car.laneChangeTimer <= 0) {
                            car.targetLane = (Math.random() - 0.5) * 14; 
                            car.laneChangeTimer = 2.0 + Math.random() * 3.0; 
                        }
                        
                        const laneError = car.targetLane - car.lane;
                        const maxSteerAngle = 0.08; 
                        let desiredSteerAngle = laneError * 0.04; 
                        desiredSteerAngle = Math.max(-maxSteerAngle, Math.min(maxSteerAngle, desiredSteerAngle));

                        car.steerAngle = THREE.MathUtils.lerp(car.steerAngle, desiredSteerAngle, 4.0 * delta);

                        const speedMetersPerSecond = car.speedKmh / 3.6;
                        const forwardDistance = speedMetersPerSecond * delta;
                        
                        car.lane += Math.sin(car.steerAngle) * forwardDistance;
                        
                        const trackForwardDistance = Math.cos(car.steerAngle) * forwardDistance;
                        car.progress += (trackForwardDistance / TRACK_LENGTH_METERS);
                        
                        let p = car.progress;
                        if (car.nextCP === 1 && p > 0.20 && p < 0.40) car.nextCP = 2;
                        if (car.nextCP === 2 && p > 0.50 && p < 0.70) car.nextCP = 3;
                        if (car.nextCP === 3 && p > 0.80 && p < 0.98) car.nextCP = 4;

                        if (car.progress >= 1.0) { 
                            car.progress -= 1.0; 
                            if (car.nextCP === 4) {
                                car.lap++; 
                                car.nextCP = 1;
                                if (car.lap > TOTAL_LAPS && raceState === 'RACING') {
                                    raceState = 'FINISHED';
                                    document.getElementById('winner-screen').style.display = 'flex';
                                    document.getElementById('winner-text').innerText = `${car.id} WINS!`;
                                }
                            }
                        }

                        car.lane = Math.max(-10.5, Math.min(10.5, car.lane)); 
                        let safeProgress = car.progress;
                        if (safeProgress < 0) safeProgress += 1;
                        if (safeProgress > 1) safeProgress %= 1;

                        const point = curve.getPointAt(safeProgress);
                        const tangent = curve.getTangentAt(safeProgress);
                        const right = new THREE.Vector3().crossVectors(upVector, tangent).normalize();

                        point.add(right.clone().multiplyScalar(car.lane));
                        car.mesh.position.copy(point);

                        const lookProgress = (safeProgress + 0.005) % 1;
                        const lookPoint = curve.getPointAt(lookProgress);
                        const lookTangent = curve.getTangentAt(lookProgress);
                        const lookRight = new THREE.Vector3().crossVectors(upVector, lookTangent).normalize();
                        
                        lookPoint.add(lookRight.clone().multiplyScalar(car.lane));
                        const lookDistanceAhead = TRACK_LENGTH_METERS * 0.005;
                        const lateralShift = Math.tan(car.steerAngle) * lookDistanceAhead;
                        lookPoint.add(lookRight.clone().multiplyScalar(lateralShift));
                        car.mesh.lookAt(lookPoint);
                    }
                } else {
                    car.speedKmh = 0; 
                }
                
                car.score = (car.lap * 1000) + car.progress;
            });

            if (targetCar && raceState !== 'LOADING') {
                const carPos = targetCar.mesh.position.clone();
                const carDir = new THREE.Vector3();
                targetCar.mesh.getWorldDirection(carDir); 

                let idealPos = new THREE.Vector3();
                let idealLookAt = new THREE.Vector3();

                if (cameraMode === '3RD_PERSON') {
                    const absSpeed = Math.abs(targetCar.speedKmh);
                    const speedRatio = Math.max(0, Math.min(1, absSpeed / 155));
                    
                    const targetOffsetZ = -4.5 - (speedRatio * 0.5); 
                    const targetFov = 60 + (speedRatio * 2);

                    dynamicCamOffsetZ = THREE.MathUtils.lerp(dynamicCamOffsetZ, targetOffsetZ, 0.05);
                    dynamicCamFov = THREE.MathUtils.lerp(dynamicCamFov, targetFov, 0.05);
                    
                    camera.fov = dynamicCamFov;
                    camera.updateProjectionMatrix();

                    const offset = carDir.clone().multiplyScalar(dynamicCamOffsetZ); 
                    offset.y += 2.5; 
                    idealPos.copy(carPos.clone().add(offset));

                    idealLookAt.copy(carPos.clone().add(carDir.clone().multiplyScalar(40)));
                    idealLookAt.y += 1;
                } 
                else if (cameraMode === '1ST_PERSON') {
                    camera.fov = THREE.MathUtils.lerp(camera.fov, 60, 0.1);
                    camera.updateProjectionMatrix();

                    const offset = carDir.clone().multiplyScalar(1); 
                    offset.y += 3.5; 
                    idealPos.copy(carPos.clone().add(offset));
                    
                    idealLookAt.copy(carPos.clone().add(carDir.clone().multiplyScalar(40))); 
                    idealLookAt.y += 1.5;
                }

                if (snapCamera) {
                    camera.position.copy(idealPos);
                    currentLookAt.copy(idealLookAt);
                } else {
                    camera.position.lerp(idealPos, 10.0 * delta);
                    currentLookAt.lerp(idealLookAt, 15.0 * delta);
                }
                
                camera.lookAt(currentLookAt);
                
                document.getElementById('dashboard').style.display = 'flex';
                document.getElementById('speed-val').innerText = Math.floor(Math.abs(targetCar.speedKmh));
                document.getElementById('gear-val').innerText = targetCar.gear === 'R' ? 'R' : `GEAR ${targetCar.gear}`;
            }

            uiUpdateTimer += delta;
            if (uiUpdateTimer > 0.2 && raceState !== 'LOADING') { 
                updateMiniHUD();
                uiUpdateTimer = 0;
            }

            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
